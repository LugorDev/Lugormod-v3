name: Build

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options: [info, warning, debug]
      environment:
        description: 'Environment to run tests against'
        type: environment
        required: false
  release:
    types: [created]
  pull_request:
    branches: [ "develop" ]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "docs/*"

env:
  BUILD_DIR: build
  RESOURCES_DIR: ${{ github.workspace }}/resources
  ARTIFACT_DIR: ${{ github.workspace }}/artifacts
  ARTIFACT_NAME: Lugormod-${{ github.event.release.tag_name || github.sha }}

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.arch }} ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-latest]
        arch: [x86, x64]
        build_type: [Debug, Release]
        include:
          - os: windows-2022
            arch: x86
            platform: Win32
          - os: windows-2022
            arch: x64
            platform: x64
          - os: ubuntu-latest
            arch: x86
            arch_flags: -m32
          - os: ubuntu-latest
            arch: x64
            arch_flags: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux 32-bit toolchain
        if: runner.os == 'Linux' && matrix.arch == 'x86'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update -qq
          sudo apt install -y gcc-multilib g++-multilib libc6-dev-i386

      - name: Setup CMake
        run: cmake -B ${{ env.BUILD_DIR }} ${{ matrix.platform && format('-A {0}', matrix.platform) }} -DLMD_REGRESSION_TESTS=ON -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} ${{ matrix.arch_flags && format('-DCMAKE_C_FLAGS="{0}" -DCMAKE_CXX_FLAGS="{0}"', matrix.arch_flags) }}
        shell: bash

      - name: Build
        run: cmake --build ${{ env.BUILD_DIR }} --config ${{ matrix.build_type }} -j

      - name: Test
        run: ctest --test-dir ${{ env.BUILD_DIR }} -C ${{ matrix.build_type }} --output-on-failure

      - name: Upload PR artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: PR${{ github.event.pull_request.number }}-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.build_type }}
          path: |
            ${{ env.BUILD_DIR }}/${{ matrix.build_type }}/jampgame*.dll
            ${{ env.BUILD_DIR }}/jampgame*.so
          retention-days: 90

      - name: Install binaries (Release only)
        if: matrix.build_type == 'Release' && github.event_name == 'release'
        run: cmake --install ${{ env.BUILD_DIR }} --config Release --prefix ${{ env.RESOURCES_DIR }}/GameData

      - name: Create archive (Release only)
        if: matrix.build_type == 'Release' && github.event_name == 'release'
        run: |
          mkdir -p ${{ env.ARTIFACT_DIR }}
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            Compress-Archive -Path "${{ env.RESOURCES_DIR }}\*" -DestinationPath "${{ env.ARTIFACT_DIR }}\${{ env.ARTIFACT_NAME }}-${{ runner.os }}-${{ matrix.arch }}.zip"
          else
            tar -czvf ${{ env.ARTIFACT_DIR }}/${{ env.ARTIFACT_NAME }}-${{ runner.os }}-${{ matrix.arch }}.tar.gz -C ${{ env.RESOURCES_DIR }} .
          fi

      - name: Upload release artifact
        if: matrix.build_type == 'Release' && github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: Lugormod ${{ github.event.release.name }} - ${{ runner.os }} ${{ matrix.arch }}
          path: ${{ env.ARTIFACT_DIR }}/*

      - name: Publish to release
        if: matrix.build_type == 'Release' && github.event_name == 'release'
        uses: actions/github-script@v7
        with:
          script: |
            const upload = require('./.github/scripts/upload.js')
            await upload({github, context, core})
